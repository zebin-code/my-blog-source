name: Deploy Hugo to GitHub Pages
on:
  push:
    branches:
      - main
jobs:
  build-deploy:
#    runs-on: ubuntu-20.04
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v2
        with:
          submodules: true  # 确保拉取子模块
          fetch-depth: 0  # 拉取所有提交记录，包括分支合并记录

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v2
        with:
#          hugo-version: "latest" # 可以修改为你使用的 Hugo 版本
          hugo-version: "0.144.1" #
          extended: true # 设置是否需要 extended 版本

      - name: Check themes directory
        run: |
          echo "=== 检查主题目录内容 ==="
          ls -la themes/
          echo "=== 检查LoveIt主题是否存在 ==="
          if [ -d "themes/LoveIt" ]; then
            echo "LoveIt主题目录存在"
            echo "=== 检查LoveIt主题内部结构 ==="
            ls -la themes/LoveIt/
            echo "=== 检查LoveIt主题的layouts目录 ==="
            if [ -d "themes/LoveIt/layouts" ]; then
              ls -la themes/LoveIt/layouts/
            else
              echo "ERROR: LoveIt主题缺少layouts目录!"
            fi
          else
            echo "ERROR: LoveIt主题目录不存在!"
          fi

      - name: Build
        run: hugo

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_TOKEN }} # 另外还支持 deploy_token 和 github_token
          external_repository: zebin-code/zebin-code.github.io # 修改为你的 GitHub Pages 仓库
          publish_dir: ./public
#          keep_files: false
          publish_branch: main
       
